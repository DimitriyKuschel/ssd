services:
  ssd:
    build: .
    ports:
      - "${SSD_PORT:-8090}:8090"
    volumes:
      - ${SSD_DATA_DIR:-./data}:/data/ssd
      - ${SSD_LOGS_DIR:-./logs}:/var/log/ssd
    environment:
      - SSD_LOG_LEVEL=${SSD_LOG_LEVEL:-info}
      - SSD_AGGREGATION_INTERVAL=${SSD_AGGREGATION_INTERVAL:-60s}
      - SSD_SAVE_INTERVAL=${SSD_SAVE_INTERVAL:-120s}
      - SSD_CACHE_ENABLED=${SSD_CACHE_ENABLED:-true}
      - SSD_CACHE_SIZE=${SSD_CACHE_SIZE:-32}
      - SSD_METRICS_ENABLED=${SSD_METRICS_ENABLED:-true}
      - SSD_MAX_CHANNELS=${SSD_MAX_CHANNELS:-1000}
      - SSD_MAX_RECORDS=${SSD_MAX_RECORDS:--1}
      - SSD_EVICTION_PERCENT=${SSD_EVICTION_PERCENT:-10}
      - SSD_MAX_RECORDS_PER_FP=${SSD_MAX_RECORDS_PER_FP:--1}
      - SSD_FINGERPRINT_TTL=${SSD_FINGERPRINT_TTL:-0}
      - SSD_COLD_STORAGE_DIR=${SSD_COLD_STORAGE_DIR:-}
      - SSD_COLD_TTL=${SSD_COLD_TTL:-0}
    restart: unless-stopped
    stop_grace_period: 10s
